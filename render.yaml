services:
  - type: web
    name: moneycouncil
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEPLOYMENT_MODE
        value: hosted
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Paste Neon.tech or Supabase PostgreSQL connection string here
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false # Requires phone verification on build.nvidia.com
      - key: NVIDIA_MODEL_ID
        value: z-ai/glm-5.3-flash
      - key: NVIDIA_KIMI_MODEL_ID
        value: moonshotai/kimi-k3
