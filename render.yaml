services:
  - type: web
    name: moneycouncil
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEPLOYMENT_MODE
        value: hosted
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: KEEP_ALIVE_ENABLED
        value: "true" # Enables automated 10-minute self-pinging via RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        sync: false # Paste Neon.tech or Supabase PostgreSQL connection string here
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false # Free endpoint key from build.nvidia.com
